name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
      - name: Verify wrapper and dependency pins
        run: |
          python3 tools/verify_build_pins.py
      - name: Verify
        run: |
          chmod +x gradlew
          ./gradlew --dependency-verification strict testDebugUnitTest lintDebug assembleRelease
      - name: Audit dependency advisories
        run: python3 tools/audit_dependencies.py
